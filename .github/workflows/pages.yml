name: Deploy web app + APK (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # مسیر انتشار روی GitHub Pages (project site)
  BASE_PATH: /hozor/
  # کلید امضای ثابت اپ تا نسخه‌های بعدی روی نسخه قبلی نصب شوند
  KEYSTORE_PASSWORD: hozor2026
  KEY_ALIAS: hozor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set app version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+(v[2]||0)")
          sed -i "s/versionCode 1/versionCode ${CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "version ${VERSION} / code ${CODE}"

      - name: Configure release signing
        run: |
          cp signing/hozor-release.p12 android/app/hozor-release.p12
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file('hozor-release.p12')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Put APK next to the web app (served by Pages CDN)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/dl
          cp android/app/build/outputs/apk/release/app-release.apk dist/dl/hozor.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/dl/hozor-${VERSION}.apk"
          ls -lh dist/dl

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
