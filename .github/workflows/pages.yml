name: Publish app (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

env:
  # مسیر انتشار روی GitHub Pages (project site)
  BASE_PATH: /hozor/
  # کلید امضای ثابت اپ تا نسخه‌های بعدی روی نسخه قبلی نصب شوند
  KEYSTORE_PASSWORD: hozor2026
  KEY_ALIAS: hozor

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set app version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+(v[2]||0)")
          sed -i "s/versionCode 1/versionCode ${CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "version ${VERSION} / code ${CODE}"

      - name: Configure release signing
        run: |
          cp signing/hozor-release.p12 android/app/hozor-release.p12
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file('hozor-release.p12')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build CDN variant (jsDelivr, no Pages needed)
        run: |
          BASE_PATH=/gh/mazodimobinhost-creator/hozor@gh-pages/cdn/ npm run build -- --outDir dist-cdn
          mkdir -p dist/cdn
          cp -r dist-cdn/. dist/cdn/
          ls dist/cdn | head

      - name: Put APK next to the web app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/dl
          cp android/app/build/outputs/apk/release/app-release.apk dist/dl/hozor.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/dl/hozor-${VERSION}.apk"
          touch dist/.nojekyll
          ls -lh dist/dl

      - name: Upload APK to public mirrors
        continue-on-error: true
        run: |
          set -e
          APK=dist/dl/hozor.apk
          VERSION=$(node -p "require('./package.json').version")
          PAGES="https://mazodimobinhost-creator.github.io/hozor/dl/hozor.apk"
          JSDELIVR="https://cdn.jsdelivr.net/gh/mazodimobinhost-creator/hozor@gh-pages/dl/hozor.apk"
          RELEASE="https://github.com/mazodimobinhost-creator/hozor/releases/download/v${VERSION}/hozor-${VERSION}.apk"

          CATBOX=$(curl -sS --max-time 120 -F "reqtype=fileupload" -F "fileToUpload=@${APK}" https://catbox.moe/user/api.php || true)
          ZEROX=$(curl -sS --max-time 120 -A "hozor-app/1.0" -F "file=@${APK}" https://0x0.st || true)

          case "$CATBOX" in https://*) ;; *) CATBOX="" ;; esac
          case "$ZEROX" in https://*) ;; *) ZEROX="" ;; esac

          node -e '
            const fs = require("fs");
            const [pages, jsdelivr, release, catbox, zerox, version] = process.argv.slice(1);
            const list = [
              { label: "GitHub Pages", url: pages },
              { label: "آینه jsDelivr", url: jsdelivr },
            ];
            if (catbox) list.push({ label: "آینه Catbox", url: catbox });
            if (zerox) list.push({ label: "آینه 0x0.st", url: zerox });
            list.push({ label: "GitHub Release", url: release });
            fs.writeFileSync("dist/dl/mirrors.json", JSON.stringify({ version, mirrors: list }, null, 2));
            console.log(JSON.stringify(list, null, 2));
          ' "$PAGES" "$JSDELIVR" "$RELEASE" "$CATBOX" "$ZEROX" "$VERSION"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'

      - name: Verify public URLs (from the runner)
        continue-on-error: true
        run: |
          sleep 25
          node - <<'NODE'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');
          const urls = {
            pages_index: 'https://mazodimobinhost-creator.github.io/hozor/',
            pages_apk: 'https://mazodimobinhost-creator.github.io/hozor/dl/hozor.apk',
            jsdelivr_index: 'https://cdn.jsdelivr.net/gh/mazodimobinhost-creator/hozor@gh-pages/index.html',
            jsdelivr_apk: 'https://cdn.jsdelivr.net/gh/mazodimobinhost-creator/hozor@gh-pages/dl/hozor.apk',
            jsdelivr_cdn_index: 'https://cdn.jsdelivr.net/gh/mazodimobinhost-creator/hozor@gh-pages/cdn/index.html',
            jsdelivr_cdn_js: 'https://cdn.jsdelivr.net/gh/mazodimobinhost-creator/hozor@gh-pages/cdn/manifest.webmanifest',
            statically_index: 'https://cdn.statically.io/gh/mazodimobinhost-creator/hozor/gh-pages/index.html',
          };
          const result = { checkedAt: new Date().toISOString(), urls: {} };
          for (const [key, url] of Object.entries(urls)) {
            try {
              const raw = execSync(
                `curl -sSIL --max-time 45 -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' "${url}"`,
                { encoding: 'utf8' },
              ).trim();
              const [status, type, size] = raw.split('|');
              result.urls[key] = { url, status: Number(status), contentType: type, size: Number(size) };
            } catch (error) {
              result.urls[key] = { url, status: 0, error: String(error.status || 'error') };
            }
          }
          fs.mkdirSync('dist/dl', { recursive: true });
          fs.writeFileSync('dist/dl/verify.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Publish verification result
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy+verify: ${{ github.sha }}'
